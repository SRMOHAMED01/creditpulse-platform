creditpulse:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('CREDITPULSE_DB_HOST', 'localhost') }}"
      port: "{{ env_var('CREDITPULSE_DB_PORT', '5432') | int }}"
      user: "{{ env_var('CREDITPULSE_DB_USER', 'postgres') }}"
      password: "{{ env_var('CREDITPULSE_DB_PASSWORD') }}"
      dbname: "{{ env_var('CREDITPULSE_DB_NAME', 'creditpulse') }}"
      schema: public
      threads: 4
