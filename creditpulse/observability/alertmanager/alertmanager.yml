# alertmanager.yml — Règles d'alerte (Palier E.3)

route:
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  receiver: 'default'

receivers:
  - name: 'default'
    slack_configs:
      - api_url: 'http://slack:5000'
        channel: '#alerts'
        send_group_wait: 30s
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
        text: '{{ .CommonAnnotations.description }}'