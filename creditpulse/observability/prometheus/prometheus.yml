# prometheus.yml — Config de scraping (Palier E.1)
# À COMPLÉTER : scrape_configs pointant vers le backend FastAPI
# (endpoint /metrics exposé par prometheus-fastapi-instrumentator)

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'creditpulse-backend'
    static_configs:
      - targets: ['backend:8000']
