name: CreditPulse CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ============================================================
  # 1. Backend Testing & Linting Job
  # ============================================================
  backend-tests:
    name: Backend Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: creditpulse
          POSTGRES_PASSWORD: creditpulse_password
          POSTGRES_DB: creditpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r creditpulse/backend/requirements-dev.txt

      - name: Run Backend Pytest Suite
        env:
          SECRET_KEY: "ci_secret_key_testing_123456789012345678901234567890"
          POSTGRES_HOST: "localhost"
          POSTGRES_PORT: 5432
          POSTGRES_USER: "creditpulse"
          POSTGRES_PASSWORD: "creditpulse_password"
          POSTGRES_DB: "creditpulse"
          MODEL_PATH: "creditpulse/ml/model_registry/model.json"
        run: |
          cd creditpulse
          pytest -v

  # ============================================================
  # 2. Frontend Build Verification Job
  # ============================================================
  frontend-build:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: creditpulse/frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd creditpulse/frontend
          npm ci

      - name: Build React App (Vite)
        run: |
          cd creditpulse/frontend
          npm run build

  # ============================================================
  # 3. Docker Compose Verification Job
  # ============================================================
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Services
        run: |
          cd creditpulse
          docker compose config
