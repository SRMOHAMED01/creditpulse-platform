name: CreditPulse CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ============================================================
  # 1. Backend Lint (ruff)
  # ============================================================
  backend-lint:
    name: Backend Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linter
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.17.0

      - name: Run ruff
        working-directory: creditpulse
        run: ruff check backend

  # ============================================================
  # 2. Backend Testing Job
  # ============================================================
  backend-tests:
    name: Backend Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: creditpulse
          POSTGRES_PASSWORD: creditpulse_password
          POSTGRES_DB: creditpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r creditpulse/backend/requirements-dev.txt

      - name: Run Backend Pytest Suite
        env:
          SECRET_KEY: "ci_secret_key_testing_123456789012345678901234567890"
          POSTGRES_HOST: "localhost"
          POSTGRES_PORT: 5432
          POSTGRES_USER: "creditpulse"
          POSTGRES_PASSWORD: "creditpulse_password"
          POSTGRES_DB: "creditpulse"
          MODEL_PATH: "creditpulse/ml/model_registry/model.json"
        run: |
          cd creditpulse
          pytest -v

  # ============================================================
  # 3. Frontend Lint (eslint)
  # ============================================================
  frontend-lint:
    name: Frontend Lint (eslint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: creditpulse/frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd creditpulse/frontend
          npm ci

      - name: Run ESLint
        run: |
          cd creditpulse/frontend
          npm run lint

  # ============================================================
  # 4. Frontend Unit Tests (vitest)
  # ============================================================
  frontend-tests:
    name: Frontend Unit Tests (vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: creditpulse/frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd creditpulse/frontend
          npm ci

      - name: Run Vitest Suite
        run: |
          cd creditpulse/frontend
          npm run test

  # ============================================================
  # 5. Frontend Build Verification Job
  # ============================================================
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: creditpulse/frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd creditpulse/frontend
          npm ci

      - name: Build React App (Vite)
        run: |
          cd creditpulse/frontend
          npm run build

  # ============================================================
  # 6. Docker Image Build Verification
  # ============================================================
  docker-build:
    name: Docker Image Build Check
    runs-on: ubuntu-latest
    needs:
      - backend-lint
      - backend-tests
      - frontend-lint
      - frontend-tests

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose Configuration
        run: |
          cd creditpulse
          docker compose config

      - name: Build Backend Image
        uses: docker/build-push-action@v6
        with:
          context: creditpulse
          file: creditpulse/backend/Dockerfile
          push: false
          tags: creditpulse-backend:ci

      - name: Build Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: creditpulse/frontend
          file: creditpulse/frontend/Dockerfile
          push: false
          tags: creditpulse-frontend:ci
