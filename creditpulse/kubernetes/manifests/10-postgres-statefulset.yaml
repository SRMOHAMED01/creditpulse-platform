# PostgreSQL — StatefulSet avec PersistentVolumeClaim (Palier G)
# DNS stable via le service headless : creditpulse-postgres:5432
apiVersion: v1
kind: Service
metadata:
  name: creditpulse-postgres
  namespace: creditpulse
  labels:
    app.kubernetes.io/name: creditpulse-postgres
    app.kubernetes.io/part-of: creditpulse
spec:
  clusterIP: None
  selector:
    app: creditpulse-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: creditpulse-postgres
  namespace: creditpulse
  labels:
    app.kubernetes.io/name: creditpulse-postgres
    app.kubernetes.io/part-of: creditpulse
spec:
  serviceName: creditpulse-postgres
  replicas: 1
  selector:
    matchLabels:
      app: creditpulse-postgres
  template:
    metadata:
      labels:
        app: creditpulse-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: creditpulse-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: creditpulse-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: creditpulse-config
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: creditpulse-postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: creditpulse-postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
