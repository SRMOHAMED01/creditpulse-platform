# Secrets (Palier G) — valeurs de démonstration UNIQUEMENT, identiques à
# .env.example. À remplacer par un vrai secret géré (Sealed Secrets,
# External Secrets Operator, `stringData` patché par la CI, ...) avant tout
# déploiement réel. Ne pas committer de secret de production.
apiVersion: v1
kind: Secret
metadata:
  name: creditpulse-secret
  namespace: creditpulse
  labels:
    app.kubernetes.io/name: creditpulse
    app.kubernetes.io/part-of: creditpulse
type: Opaque
stringData:
  # Doit faire au moins 32 caractères (validation core/config.py)
  SECRET_KEY: dev-only-creditpulse-secret-key-please-rotate-2026
  POSTGRES_USER: creditpulse
  POSTGRES_PASSWORD: creditpulse_dev_password
  # URL complète consommée par le backend (psycopg2)
  DATABASE_URL: postgresql://creditpulse:creditpulse_dev_password@creditpulse-postgres:5432/creditpulse_db
