# Kafka — broker unique pour la démo (Palier C), configuration identique
# au service docker-compose (KAFKA_ADVERTISED_LISTENERS interne au cluster).
apiVersion: v1
kind: Service
metadata:
  name: creditpulse-kafka
  namespace: creditpulse
  labels:
    app.kubernetes.io/name: creditpulse-kafka
    app.kubernetes.io/part-of: creditpulse
spec:
  clusterIP: None
  selector:
    app: creditpulse-kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: creditpulse-kafka
  namespace: creditpulse
  labels:
    app.kubernetes.io/name: creditpulse-kafka
    app.kubernetes.io/part-of: creditpulse
spec:
  serviceName: creditpulse-kafka
  replicas: 1
  selector:
    matchLabels:
      app: creditpulse-kafka
  template:
    metadata:
      labels:
        app: creditpulse-kafka
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.6.1
          ports:
            - name: kafka
              containerPort: 9092
          env:
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: creditpulse-zookeeper:2181
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://creditpulse-kafka:9092
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://0.0.0.0:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: PLAINTEXT:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
          readinessProbe:
            exec:
              command: ["bash", "-c", "echo 'health' | nc -w 2 localhost 9092"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
