# HPA — scale automatique du backend (Palier G)
# Démo : kubectl run hey --rm -it --image=williamyeh/hey -- -z 2m -c 200 \
#          http://<INGRESS_HOST>/api/health
# puis : kubectl get hpa creditpulse-backend -n creditpulse --watch
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: creditpulse-backend
  namespace: creditpulse
  labels:
    app.kubernetes.io/name: creditpulse-backend
    app.kubernetes.io/part-of: creditpulse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: creditpulse-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 60
