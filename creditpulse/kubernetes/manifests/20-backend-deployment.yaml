# Backend FastAPI — Deployment + Service (Palier G)
# Build : docker build -t creditpulse-backend:latest -f backend/Dockerfile .
# (depuis le répertoire creditpulse/)
apiVersion: v1
kind: Service
metadata:
  name: creditpulse-backend
  namespace: creditpulse
  labels:
    app.kubernetes.io/name: creditpulse-backend
    app.kubernetes.io/part-of: creditpulse
spec:
  selector:
    app: creditpulse-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: creditpulse-backend
  namespace: creditpulse
  labels:
    app.kubernetes.io/name: creditpulse-backend
    app.kubernetes.io/part-of: creditpulse
spec:
  # minReplicas du HPA : garder l'alignement
  replicas: 2
  selector:
    matchLabels:
      app: creditpulse-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: creditpulse-backend
      annotations:
        # Scraping Prometheus (Palier E) par annotations standards
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      # Migrations Alembic avant démarrage = équivalent du service `migrate`
      # (service_completed_successfully) de docker-compose.
      initContainers:
        - name: migrate
          image: creditpulse-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: creditpulse-secret
                  key: DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: creditpulse-secret
                  key: SECRET_KEY
            - name: MODEL_PATH
              valueFrom:
                configMapKeyRef:
                  name: creditpulse-config
                  key: MODEL_PATH
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      containers:
        - name: backend
          image: creditpulse-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: creditpulse-secret
                  key: DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: creditpulse-secret
                  key: SECRET_KEY
            - name: MODEL_PATH
              valueFrom:
                configMapKeyRef:
                  name: creditpulse-config
                  key: MODEL_PATH
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: creditpulse-config
                  key: CORS_ORIGINS
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: creditpulse-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: KAFKA_TOPIC_REQUESTS
              valueFrom:
                configMapKeyRef:
                  name: creditpulse-config
                  key: KAFKA_TOPIC_REQUESTS
            - name: KAFKA_TOPIC_DECISIONS
              valueFrom:
                configMapKeyRef:
                  name: creditpulse-config
                  key: KAFKA_TOPIC_DECISIONS
            - name: MLFLOW_TRACKING_URI
              valueFrom:
                configMapKeyRef:
                  name: creditpulse-config
                  key: MLFLOW_TRACKING_URI
          # Liveness : process vivant (endpoint simple, pas de dépendance)
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          # Readiness : vérifie DB + modèle (endpoint /ready)
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
