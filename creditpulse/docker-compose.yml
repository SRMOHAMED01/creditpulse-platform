services:

  # ============================================================
  # PostgreSQL
  # ============================================================

  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - pg_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  # ============================================================
  # Backend — FastAPI
  # ============================================================

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      MODEL_PATH: /app/ml/model_registry/model.json

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ./backend:/app
      - ./ml:/app/ml


  # ============================================================
  # Frontend — React + Vite
  # ============================================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    environment:
      VITE_API_BASE_URL: http://localhost:8000

    ports:
      - "5173:5173"

    depends_on:
      - backend


# ============================================================
# Volumes
# ============================================================

volumes:
  pg_data: