# ============================================================
# docker-compose.yml — Orchestration complète CreditPulse
# ============================================================
# À COMPLÉTER (Palier F). Services attendus :
#   - postgres        : base de données principale
#   - redis           : cache + sessions
#   - zookeeper+kafka  : broker d'événements (Palier C)
#   - backend          : API FastAPI
#   - kafka-consumer    : service séparé qui consomme les topics Kafka
#   - frontend           : app React (servie en build statique ou dev server)
#   - airflow-webserver + airflow-scheduler : orchestration pipeline (Palier B)
#   - mlflow              : tracking des modèles (Palier D)
#   - prometheus           : collecte de métriques (Palier E)
#   - grafana                : dashboards (Palier E)
#   - alertmanager             : alerting (Palier E)
#
# Conseil : commence par ajouter seulement postgres + backend + frontend
# (Palier A), puis ajoute les autres services au fur et à mesure des paliers.

version: "3.9"

services:
  postgres:
    image: postgres:16
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  # TODO Palier A : backend, frontend
  # TODO Palier C : zookeeper, kafka, kafka-consumer
  # TODO Palier B : airflow-webserver, airflow-scheduler
  # TODO Palier D : mlflow
  # TODO Palier E : prometheus, grafana, alertmanager

volumes:
  pg_data:
